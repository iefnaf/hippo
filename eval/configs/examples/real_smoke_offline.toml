# M2 real-data offline smoke config (generated by scripts/make_split.py;
# smoke semantics aligned with the M1 offline_fake subset: six question
# types + two abstention ids, drawn from the DEV side of the 50/450 split).
# Requires the pinned LongMemEval-S file: run scripts/fetch_longmemeval.py
# first. Fake memory/reader/judge only — no external model is contacted.

name = "real-smoke-offline"
dataset_plan = "longmemeval-s-cleaned@1"
sample_plan_id = "longmemeval-s-smoke-8"
sample_ids = [
  "1de5cff2",
  "4dfccbf8",
  "6c49646a",
  "8550ddae",
  "a89d7624",
  "ba61f0b9",
  "f4f1d8a4_abs",
  "gpt4_70e84552_abs"
]
smoke_subset_ids = [
  "1de5cff2",
  "4dfccbf8",
  "6c49646a",
  "8550ddae",
  "a89d7624",
  "ba61f0b9",
  "f4f1d8a4_abs",
  "gpt4_70e84552_abs"
]
evidence_token_budget = 4096
notes = "8 real LongMemEval-S questions through the full offline loop with fake components; smoke scores never enter formal reports."

[memory]
name = "fake-memory"
baseline_kind = "adapter"
capabilities = [
  "extractive_evidence",
  "generated_evidence",
  "state_inspection",
  "async_mutation",
  "idempotent_mutation",
  "operation_status",
]

[memory.config]
mutation_mode = "async"
evidence_kinds = ["extractive", "generated"]
retrieval_mode = "match"
idempotent = true
state_inspection = true
async_lag = 1

[reader]
model = "fake-reader"
model_family = "fake-reader-family"
base_url = "offline://fake"
temperature = 0.0
max_output_tokens = 1024
tokenizer_id = "test:char-v1"
counting_mode = "test"

[judge]
model = "fake-judge"
model_family = "fake-judge-family"
base_url = "offline://fake"
temperature = 0.0
protocol_id = "longmemeval-yes-no@1"
protocol_source_commit = "0000000000000000000000000000000000000000"

[run_params]
max_retries = 3
backoff_base_s = 1.0
await_ready_timeout_s = 300.0
question_concurrency = 1
