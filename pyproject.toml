[project]
name = "hippo-eval"
version = "0.1.0"
description = "Memory eval harness for the hippo shared memory layer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.scripts]
hippo-eval = "eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
